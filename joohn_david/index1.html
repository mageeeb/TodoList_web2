<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
	  <main class="container">
	     <h1> Ma Toto Liste </h1>
	        <form id="totoForm">
				<input type="text" placeholder="Ajouter une tache ..." id="todoInput" autocomplete="off">
				<button type="submit"> Ajouter </button>
			</form>

		<p id="message"></p>

			<ul id="todoList">
				<li></li>
			</ul>

                 <div class="footer">
					<p><span id="count">0</span> taches(s) restante(s)</p>
	                <div class="filters">
						<button class="filter active" data-filter="all">Toutes</button>
						<button class="filter" data-filter="todo"> A faire </button>
						<button class="filter" data-filter="done"> Terminées </button>
		         	</div>
				</div>
	</main>
	                          	  
  </body>
</html>
