<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">

	<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <!-- Montserrat importation -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Oswald importation -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Gravitas+One&family=Merienda:wght@300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Titan+One&display=swap" rel="stylesheet">


  </head>
  <body>
	<main class="container">

		<h1>Ma Todo List</h1>
		<form id="todoForm">
			<input type="text" id="todoInput" placeholder="Ajouter une tâche..." autocomplete="off">
			<button type="submit">Ajouter</button>
		</form>

		<p id="message"></p>

		<ul id="todoList"></ul>

		<div class="footer">

			<p><span id="count"> 0 </span>tâche(s) restante(s) </p>
			<div class="filters">
				<button class="filter active" data-filter="all"> Toutes </button>
				<button class="filter" data-filter="todo"> A faire</button>
				<button class="filter" data-filter="done"> Terminées </button>
			</div>
		</div>
	</main>





  	<script src="js/script.js"></script>
  </body>
</html>
